[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mammal-dili"
version = "0.1.0"
description = "Reproducible DILIrank 2.0 representation benchmark"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rdkit>=2025.3,<2027",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
mammal-dili = "mammal_dili.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

